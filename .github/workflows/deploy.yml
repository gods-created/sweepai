name: CICD process

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      
      - name: Setup checkout
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v3
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --no-cache-dir -r requirements.txt